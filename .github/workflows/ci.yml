name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432/tcp"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test -race ./...
        env:
          FAMILYTV_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - run: docker build -t familytv-browser-test .
      - run: npx playwright test
        working-directory: web
        env:
          FAMILYTV_TEST_IMAGE: familytv-browser-test
          FAMILYTV_TEST_BROWSER: chrome

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh

  android-tv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon assembleDebug lintDebug
        working-directory: android-tv
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTV-Android-TV-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
