name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432/tcp"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test -race ./...
        env:
          FAMILYTV_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: web
      - run: npx playwright test
        working-directory: web

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh
