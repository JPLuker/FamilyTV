services:
  db:
    image: postgres:17-alpine
    entrypoint: ['sh', '-ec', 'export POSTGRES_PASSWORD=$$(head -c 32 /dev/urandom | base64); exec docker-entrypoint.sh "$$@"', '--']
    command: ["postgres", "-c", "listen_addresses="]
    environment:
      POSTGRES_DB: familytv
      POSTGRES_HOST_AUTH_METHOD: reject
    volumes:
      - familytv_db:/var/lib/postgresql/data
      - familytv_socket:/var/run/postgresql
      - ./deploy/postgres/10-familytv.sh:/docker-entrypoint-initdb.d/10-familytv.sh:ro
    healthcheck:
      test: ["CMD", "psql", "-U", "familytv", "-d", "familytv", "-c", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    environment:
      FAMILYTV_DATABASE_URL: "host=/var/run/postgresql dbname=familytv user=familytv sslmode=disable connect_timeout=5"
    volumes:
      - familytv_socket:/var/run/postgresql:ro
      - familytv_data:/data:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  familytv_data:
  familytv_db:
  familytv_socket:
